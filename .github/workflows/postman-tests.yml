name: Postman API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra newman-reporter-junitfull
      
      - name: Run Postman Collection
        run: |
          mkdir -p reports
          newman run "https://api.getpostman.com/collections/48072727-563ceed9-6504-402b-b534-cecb13f79d6f?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --environment "https://api.getpostman.com/environments/48072727-4c7a9092-93cc-4de3-8b56-e0bf5dbd09a1?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --ssl-client-cert "/Users/boduniyi/Desktop/actions-runner/certs/CJE8NXWsIJe-oN0U5beb1TCIEvpAKrhfWxHtNd7ORko.pem" \
            --ssl-client-key "/Users/boduniyi/Desktop/actions-runner/certs/86978693-3039-449d-9acd-3771392a4c7f-opf_uae_client_signing.key" \
            --insecure \
            --reporters cli,htmlextra,junitfull,json \
            --reporter-htmlextra-export reports/test-report.html \
            --reporter-junitfull-export reports/junit-report.xml \
            --reporter-json-export reports/results.json
      
      - name: Send Slack Notification
        if: always()
        run: |
          if [ -f reports/results.json ]; then
            TOTAL_REQUESTS=$(jq '.run.stats.requests.total' reports/results.json 2>/dev/null || echo 0)
            FAILED_REQUESTS=$(jq '.run.stats.requests.failed' reports/results.json 2>/dev/null || echo 0)
            TOTAL_ASSERTIONS=$(jq '.run.stats.assertions.total' reports/results.json 2>/dev/null || echo 0)
            FAILED_ASSERTIONS=$(jq '.run.stats.assertions.failed' reports/results.json 2>/dev/null || echo 0)
            PASSED_ASSERTIONS=$((TOTAL_ASSERTIONS - FAILED_ASSERTIONS))
            PASSED_REQUESTS=$((TOTAL_REQUESTS - FAILED_REQUESTS))
            RESPONSE_TIME=$(jq '.run.timings.responseAverage' reports/results.json 2>/dev/null || echo 0)
            ENDPOINT_NAME=$(jq -r '.run.executions[0].item.name' reports/results.json 2>/dev/null || echo "Unknown")
            ENDPOINT_URL=$(jq -r '.run.executions[0].request.url.raw' reports/results.json 2>/dev/null | sed 's/https:\/\///' | cut -d'/' -f1-2 || echo "Unknown")
          else
            TOTAL_REQUESTS=0
            FAILED_REQUESTS=0
            TOTAL_ASSERTIONS=0
            FAILED_ASSERTIONS=0
            PASSED_ASSERTIONS=0
            PASSED_REQUESTS=0
            RESPONSE_TIME=0
            ENDPOINT_NAME="Unknown"
            ENDPOINT_URL="Unknown"
          fi
          
          if [ "$FAILED_ASSERTIONS" -eq 0 ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="ALL TESTS PASSED"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="TESTS FAILED"
          fi
          
          cat > /tmp/slack_payload.json << 'SLACKEOF'
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "STATUS_PLACEHOLDER Newman Test Report - TIME_PLACEHOLDER",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Status:*\nSTATUS_TEXT_PLACEHOLDER"},
                  {"type": "mrkdwn", "text": "*Endpoint:*\nENDPOINT_PLACEHOLDER"}
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*📊 Endpoints Tested:*\nTOTAL_REQ_PLACEHOLDER"},
                  {"type": "mrkdwn", "text": "*✅ Passed Endpoints:*\nPASSED_REQ_PLACEHOLDER"},
                  {"type": "mrkdwn", "text": "*❌ Failed Endpoints:*\nFAILED_REQ_PLACEHOLDER"},
                  {"type": "mrkdwn", "text": "*⚡ Avg Response:*\nRESPONSE_TIME_PLACEHOLDER ms"}
                ]
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*🧪 Total Assertions:*\nTOTAL_ASSERT_PLACEHOLDER"},
                  {"type": "mrkdwn", "text": "*✅ Passed:*\nPASSED_ASSERT_PLACEHOLDER"},
                  {"type": "mrkdwn", "text": "*❌ Failed:*\nFAILED_ASSERT_PLACEHOLDER"},
                  {"type": "mrkdwn", "text": "*📄 Report:*\n<https://github.com/qualicion/adcb-internal-tests/actions|Download>"}
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Open Finance UAT - Retail API Tests"
                  }
                ]
              }
            ]
          }
          SLACKEOF
          
          sed -i "s/STATUS_PLACEHOLDER/${STATUS_EMOJI}/g" /tmp/slack_payload.json
          sed -i "s/TIME_PLACEHOLDER/$(date '+%Y-%m-%d %H:%M')/g" /tmp/slack_payload.json
          sed -i "s/STATUS_TEXT_PLACEHOLDER/${STATUS_TEXT}/g" /tmp/slack_payload.json
          sed -i "s/ENDPOINT_PLACEHOLDER/${ENDPOINT_NAME}/g" /tmp/slack_payload.json
          sed -i "s/TOTAL_REQ_PLACEHOLDER/${TOTAL_REQUESTS}/g" /tmp/slack_payload.json
          sed -i "s/PASSED_REQ_PLACEHOLDER/${PASSED_REQUESTS}/g" /tmp/slack_payload.json
          sed -i "s/FAILED_REQ_PLACEHOLDER/${FAILED_REQUESTS}/g" /tmp/slack_payload.json
          sed -i "s/RESPONSE_TIME_PLACEHOLDER/${RESPONSE_TIME}/g" /tmp/slack_payload.json
          sed -i "s/TOTAL_ASSERT_PLACEHOLDER/${TOTAL_ASSERTIONS}/g" /tmp/slack_payload.json
          sed -i "s/PASSED_ASSERT_PLACEHOLDER/${PASSED_ASSERTIONS}/g" /tmp/slack_payload.json
          sed -i "s/FAILED_ASSERT_PLACEHOLDER/${FAILED_ASSERTIONS}/g" /tmp/slack_payload.json
          
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/slack_payload.json
      
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/
