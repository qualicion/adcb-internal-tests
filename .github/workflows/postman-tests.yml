name: Postman API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra newman-reporter-junitfull
      
      - name: Run Postman Collection
        run: |
          mkdir -p reports
          newman run "https://api.getpostman.com/collections/48072727-563ceed9-6504-402b-b534-cecb13f79d6f?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --environment "https://api.getpostman.com/environments/48072727-4c7a9092-93cc-4de3-8b56-e0bf5dbd09a1?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --ssl-client-cert "/Users/boduniyi/Desktop/actions-runner/certs/CJE8NXWsIJe-oN0U5beb1TCIEvpAKrhfWxHtNd7ORko.pem" \
            --ssl-client-key "/Users/boduniyi/Desktop/actions-runner/certs/86978693-3039-449d-9acd-3771392a4c7f-opf_uae_client_signing.key" \
            --insecure \
            --reporters cli,htmlextra,junitfull,json \
            --reporter-htmlextra-export reports/test-report.html \
            --reporter-junitfull-export reports/junit-report.xml \
            --reporter-json-export reports/results.json
      
      - name: Send Slack Notification
        if: always()
        run: |
          if [ -f reports/results.json ]; then
            TOTAL_REQUESTS=$(jq '.run.stats.requests.total' reports/results.json 2>/dev/null || echo 0)
            FAILED_REQUESTS=$(jq '.run.stats.requests.failed' reports/results.json 2>/dev/null || echo 0)
            TOTAL_ASSERTIONS=$(jq '.run.stats.assertions.total' reports/results.json 2>/dev/null || echo 0)
            FAILED_ASSERTIONS=$(jq '.run.stats.assertions.failed' reports/results.json 2>/dev/null || echo 0)
            PASSED_ASSERTIONS=$((TOTAL_ASSERTIONS - FAILED_ASSERTIONS))
            PASSED_REQUESTS=$((TOTAL_REQUESTS - FAILED_REQUESTS))
            RESPONSE_TIME=$(jq '.run.timings.responseAverage' reports/results.json 2>/dev/null || echo 0)
          else
            TOTAL_REQUESTS=0
            FAILED_REQUESTS=0
            TOTAL_ASSERTIONS=0
            FAILED_ASSERTIONS=0
            PASSED_ASSERTIONS=0
            PASSED_REQUESTS=0
            RESPONSE_TIME=0
          fi
          if [ "$FAILED_ASSERTIONS" -eq 0 ]; then
            STATUS="✅ All Tests Passed"
            COLOR="good"
          else
            STATUS="❌ ${FAILED_ASSERTIONS} Assertions Failed"
            COLOR="danger"
          fi
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" -H 'Content-Type: application/json' -d "{\"text\":\"Newman Test Report - $(date '+%Y-%m-%d %H:%M')\",\"attachments\":[{\"color\":\"${COLOR}\",\"title\":\"${STATUS}\",\"fields\":[{\"title\":\"📊 Endpoints Tested\",\"value\":\"${TOTAL_REQUESTS}\",\"short\":true},{\"title\":\"✅ Passed Endpoints\",\"value\":\"${PASSED_REQUESTS}\",\"short\":true},{\"title\":\"❌ Failed Endpoints\",\"value\":\"${FAILED_REQUESTS}\",\"short\":true},{\"title\":\"🧪 Total Assertions\",\"value\":\"${TOTAL_ASSERTIONS}\",\"short\":true},{\"title\":\"✅ Passed Assertions\",\"value\":\"${PASSED_ASSERTIONS}\",\"short\":true},{\"title\":\"❌ Failed Assertions\",\"value\":\"${FAILED_ASSERTIONS}\",\"short\":true},{\"title\":\"⚡ Avg Response Time\",\"value\":\"${RESPONSE_TIME}ms\",\"short\":true},{\"title\":\"📄 Full Report\",\"value\":\"<https://github.com/qualicion/adcb-internal-tests/actions|Download HTML Report>\",\"short\":true}],\"footer\":\"Open Finance UAT - Retail API Tests\"}]}"
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/
