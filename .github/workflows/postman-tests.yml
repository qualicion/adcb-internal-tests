name: Postman API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra newman-reporter-junitfull
      
      - name: Run Postman Collection
        run: |
          mkdir -p reports
          newman run "https://api.getpostman.com/collections/48072727-563ceed9-6504-402b-b534-cecb13f79d6f?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --environment "https://api.getpostman.com/environments/48072727-4c7a9092-93cc-4de3-8b56-e0bf5dbd09a1?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --ssl-client-cert "/Users/boduniyi/Desktop/actions-runner/certs/CJE8NXWsIJe-oN0U5beb1TCIEvpAKrhfWxHtNd7ORko.pem" \
            --ssl-client-key "/Users/boduniyi/Desktop/actions-runner/certs/86978693-3039-449d-9acd-3771392a4c7f-opf_uae_client_signing.key" \
            --insecure \
            --reporters cli,htmlextra,junitfull,json \
            --reporter-htmlextra-export reports/test-report.html \
            --reporter-junitfull-export reports/junit-report.xml \
            --reporter-json-export reports/results.json
      
      - name: Send Slack Notification
        if: always()
        run: |
          if [ -f reports/results.json ]; then
            export TOTAL_REQUESTS=$(jq '.run.stats.requests.total' reports/results.json 2>/dev/null || echo 0)
            export FAILED_REQUESTS=$(jq '.run.stats.requests.failed' reports/results.json 2>/dev/null || echo 0)
            export TOTAL_ASSERTIONS=$(jq '.run.stats.assertions.total' reports/results.json 2>/dev/null || echo 0)
            export FAILED_ASSERTIONS=$(jq '.run.stats.assertions.failed' reports/results.json 2>/dev/null || echo 0)
            export PASSED_ASSERTIONS=$((TOTAL_ASSERTIONS - FAILED_ASSERTIONS))
            export PASSED_REQUESTS=$((TOTAL_REQUESTS - FAILED_REQUESTS))
            export RESPONSE_TIME=$(jq '.run.timings.responseAverage' reports/results.json 2>/dev/null || echo 0)
            export ENDPOINT_NAME=$(jq -r '.run.executions[0].item.name' reports/results.json 2>/dev/null || echo "Unknown")
          else
            export TOTAL_REQUESTS=0
            export FAILED_REQUESTS=0
            export TOTAL_ASSERTIONS=0
            export FAILED_ASSERTIONS=0
            export PASSED_ASSERTIONS=0
            export PASSED_REQUESTS=0
            export RESPONSE_TIME=0
            export ENDPOINT_NAME="Unknown"
          fi
          
          if [ "$FAILED_ASSERTIONS" -eq 0 ]; then
            export STATUS_EMOJI="✅"
            export STATUS_TEXT="ALL TESTS PASSED"
          else
            export STATUS_EMOJI="❌"
            export STATUS_TEXT="TESTS FAILED"
          fi
          
          export TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          
          python3 << 'PYEOF'
          import json
          import requests
          import os
          
          payload = {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": f"{os.environ['STATUS_EMOJI']} Newman Test Report - {os.environ['TIMESTAMP']}",
                  "emoji": True
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": f"*Status:*\n{os.environ['STATUS_TEXT']}"},
                  {"type": "mrkdwn", "text": f"*Endpoint:*\n{os.environ['ENDPOINT_NAME']}"}
                ]
              },
              {"type": "divider"},
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": f"*📊 Endpoints Tested:*\n{os.environ['TOTAL_REQUESTS']}"},
                  {"type": "mrkdwn", "text": f"*✅ Passed Endpoints:*\n{os.environ['PASSED_REQUESTS']}"},
                  {"type": "mrkdwn", "text": f"*❌ Failed Endpoints:*\n{os.environ['FAILED_REQUESTS']}"},
                  {"type": "mrkdwn", "text": f"*⚡ Avg Response:*\n{os.environ['RESPONSE_TIME']} ms"}
                ]
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": f"*🧪 Total Assertions:*\n{os.environ['TOTAL_ASSERTIONS']}"},
                  {"type": "mrkdwn", "text": f"*✅ Passed:*\n{os.environ['PASSED_ASSERTIONS']}"},
                  {"type": "mrkdwn", "text": f"*❌ Failed:*\n{os.environ['FAILED_ASSERTIONS']}"},
                  {"type": "mrkdwn", "text": "*📄 Report:*\n<https://github.com/qualicion/adcb-internal-tests/actions|Download>"}
                ]
              },
              {
                "type": "context",
                "elements": [
                  {"type": "mrkdwn", "text": "Open Finance UAT - Retail API Tests"}
                ]
              }
            ]
          }
          
          requests.post(os.environ['SLACK_WEBHOOK_URL'], json=payload)
          PYEOF
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/
