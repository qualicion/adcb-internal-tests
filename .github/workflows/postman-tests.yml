name: Postman API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  api-tests:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra newman-reporter-junitfull
      
      - name: Run Postman Collection
        continue-on-error: true
        run: |
          mkdir -p reports
          newman run "https://api.getpostman.com/collections/48072727-563ceed9-6504-402b-b534-cecb13f79d6f?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --environment "https://api.getpostman.com/environments/48072727-4c7a9092-93cc-4de3-8b56-e0bf5dbd09a1?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --ssl-client-cert "/Users/boduniyi/Desktop/actions-runner/certs/CJE8NXWsIJe-oN0U5beb1TCIEvpAKrhfWxHtNd7ORko.pem" \
            --ssl-client-key "/Users/boduniyi/Desktop/actions-runner/certs/86978693-3039-449d-9acd-3771392a4c7f-opf_uae_client_signing.key" \
            --insecure \
            --reporters cli,htmlextra,junitfull,json \
            --reporter-htmlextra-export reports/test-report.html \
            --reporter-junitfull-export reports/junit-report.xml \
            --reporter-json-export reports/results.json
      
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'reports'
      
      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Send Slack Notification
        if: always()
        run: |
          if [ -f reports/results.json ]; then
            TOTAL_REQUESTS=$(jq '.run.stats.requests.total' reports/results.json 2>/dev/null || echo 0)
            FAILED_REQUESTS=$(jq '.run.stats.requests.failed' reports/results.json 2>/dev/null || echo 0)
            TOTAL_ASSERTIONS=$(jq '.run.stats.assertions.total' reports/results.json 2>/dev/null || echo 0)
            FAILED_ASSERTIONS=$(jq '.run.stats.assertions.failed' reports/results.json 2>/dev/null || echo 0)
            PASSED_ASSERTIONS=$((TOTAL_ASSERTIONS - FAILED_ASSERTIONS))
            PASSED_REQUESTS=$((TOTAL_REQUESTS - FAILED_REQUESTS))
            RESPONSE_TIME=$(jq '.run.timings.responseAverage' reports/results.json 2>/dev/null || echo 0)
            
            ENDPOINTS_RAW=$(jq -r '.run.executions[] | "• \(.item.name): \(.response.code // "N/A")"' reports/results.json 2>/dev/null | head -20)
            ENDPOINTS_ESCAPED=$(echo "$ENDPOINTS_RAW" | jq -Rs .)
            
            if [ "$TOTAL_ASSERTIONS" -gt 0 ]; then
              SUCCESS_RATE=$((PASSED_ASSERTIONS * 100 / TOTAL_ASSERTIONS))
            else
              SUCCESS_RATE=0
            fi
          else
            TOTAL_REQUESTS=0
            FAILED_REQUESTS=0
            TOTAL_ASSERTIONS=0
            FAILED_ASSERTIONS=0
            PASSED_ASSERTIONS=0
            PASSED_REQUESTS=0
            RESPONSE_TIME=0
            ENDPOINTS_ESCAPED='"No data"'
            SUCCESS_RATE=0
          fi
          
          if [ "$FAILED_ASSERTIONS" -eq 0 ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="All ${TOTAL_ASSERTIONS} tests passed"
            COLOR="good"
          else
            STATUS_TEXT="${FAILED_ASSERTIONS} of ${TOTAL_ASSERTIONS} tests failed (${SUCCESS_RATE}% pass rate)"
            STATUS_EMOJI="❌"
            COLOR="danger"
          fi
          
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M')
          REPORT_URL="https://qualicion.github.io/adcb-internal-tests/test-report.html"
          
          cat > /tmp/slack_payload.json << EOF
          {
            "text": "${STATUS_EMOJI} Newman API Test Results - ${TIMESTAMP}",
            "attachments": [{
              "color": "${COLOR}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Status:* ${STATUS_TEXT}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*📍 Endpoints Tested*\nPLACEHOLDER"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Success Rate*\n\`${SUCCESS_RATE}%\` (${PASSED_ASSERTIONS}/${TOTAL_ASSERTIONS})" },
                    {"type": "mrkdwn", "text": "*Avg Response*\n\`${RESPONSE_TIME} ms\`"}
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*✅ Passed*\n\`${PASSED_ASSERTIONS}\` assertions"},
                    {"type": "mrkdwn", "text": "*❌ Failed*\n\`${FAILED_ASSERTIONS}\` assertions"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [{
                    "type": "button",
                    "text": {"type": "plain_text", "text": "📄 View Full Report"},
                    "url": "${REPORT_URL}",
                    "style": "primary"
                  }]
                }
              ]
            }]
          }
          EOF
          
          jq --argjson endpoints "$ENDPOINTS_ESCAPED" '.attachments[0].blocks[1].text.text = "*📍 Endpoints Tested*\n" + $endpoints' /tmp/slack_payload.json > /tmp/slack_final.json
          
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d @/tmp/slack_final.json
      
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/
